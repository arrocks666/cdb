  <!-- Tagline -->
  <text x="360" y="360" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#FFFFFF" opacity="0.95">Best Chinese Products</text>
  <text x="360" y="410" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#FFFFFF" opacity="0.95">Better Prices • Delivered to Bangladesh</text>

  <!-- Bottom strip -->
  <rect x="0" y="560" width="1200" height="70" fill="#000000" opacity="0.15"/>
  <text x="600" y="604" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#FFFFFF" text-anchor="middle">chinadailybazar.com</text>
</svg>