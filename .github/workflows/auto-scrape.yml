name: Weekly 1688 Scrape

on:
  # Run every Sunday at 21:00 UTC = Monday 3:00 AM Bangladesh time
  # Note: cron uses UTC. BD is UTC+6, so 21:00 UTC Sunday = 3:00 AM Monday BD.
  # To get Sunday 3 AM BD, we schedule Saturday 21:00 UTC.
  schedule:
    - cron: "0 21 * * 6"

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  scrape:
    name: Scrape 1688 and Import to Firestore
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Retry up to 3 times if the job fails
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        attempt: [1, 2, 3]
    continue-on-error: ${{ matrix.attempt < 3 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_1688_ACTOR_ID: ${{ secrets.APIFY_1688_ACTOR_ID }}
          APIFY_IMAGE_SEARCH_ACTOR_ID: ${{ secrets.APIFY_IMAGE_SEARCH_ACTOR_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          USD_TO_BDT: ${{ secrets.USD_TO_BDT }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
        run: npx tsx scripts/scrape-1688.ts

      - name: Import to Firestore
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_1688_ACTOR_ID: ${{ secrets.APIFY_1688_ACTOR_ID }}
          APIFY_IMAGE_SEARCH_ACTOR_ID: ${{ secrets.APIFY_IMAGE_SEARCH_ACTOR_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          USD_TO_BDT: ${{ secrets.USD_TO_BDT }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
        run: npx tsx scripts/migrate-to-firestore.ts

      - name: Summary
        if: always()
        run: |
          echo "## Weekly Scrape Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Date: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Attempt: ${{ matrix.attempt }}" >> $GITHUB_STEP_SUMMARY