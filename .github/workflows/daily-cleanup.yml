name: Daily Cleanup

on:
  # Run every day at 4 AM Bangladesh time
  # 22:00 UTC = 4:00 AM BD (next day)
  schedule:
    - cron: "0 22 * * *"

  workflow_dispatch:

jobs:
  cleanup:
    name: Clean Old Data
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run cleanup
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_1688_ACTOR_ID: ${{ secrets.APIFY_1688_ACTOR_ID }}
          APIFY_IMAGE_SEARCH_ACTOR_ID: ${{ secrets.APIFY_IMAGE_SEARCH_ACTOR_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          USD_TO_BDT: ${{ secrets.USD_TO_BDT }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
        run: npx tsx scripts/cleanup-old-data.ts

      - name: Summary
        if: always()
        run: |
          echo "## Daily Cleanup" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Date: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY